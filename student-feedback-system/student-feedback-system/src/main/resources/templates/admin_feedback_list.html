<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Feedback List</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #2575fc; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .delete-btn { padding: 5px 10px; background: red; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .delete-btn:hover { background: darkred; }
    </style>
</head>
<body>
    <h2>All Feedbacks</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Faculty</th>
            <th>Rating</th>
            <th>Comments</th>
            <th>Action</th>
        </tr>
        <tr th:each="f : ${feedbackList}">
            <td th:text="${f.id}"></td>
            <td th:text="${f.studentName}"></td>
            <td th:text="${f.email}"></td>
            <td th:text="${f.courseName}"></td>
            <td th:text="${f.facultyName}"></td>
            <td th:text="${f.rating}"></td>
            <td th:text="${f.comments}"></td>
            <td><a th:href="@{'/admin/delete/' + ${f.id}}"><button class="delete-btn">Delete</button></a></td>
        </tr>
    </table>
</body>
</html>
