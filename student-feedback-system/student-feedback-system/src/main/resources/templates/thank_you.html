<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thank You!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: rgba(0,0,0,0.6);
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back {
            background-color: #2575fc;
            color: white;
        }

        .back:hover {
            background-color: #6a11cb;
        }

        .all-feedback {
            background-color: #6a11cb;
            color: white;
        }

        .all-feedback:hover {
            background-color: #2575fc;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Thank You for Your Feedback!</h1>
        <p>Your feedback has been submitted successfully.</p>
        <a th:href="@{/}" ><button class="back">Back to Feedback Form</button></a>
        <!-- Redirect to admin login page instead of all-feedbacks -->
        <a th:href="@{/admin}" ><button class="all-feedback">View All Feedbacks</button></a>
    </div>
</body>
</html>
