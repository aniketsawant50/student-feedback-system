<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h2>Student Feedback Form</h2>
    <form th:action="@{/submit}" th:object="${feedback}" method="post">
        Name: <input type="text" th:field="*{studentName}" required><br/>
        Email: <input type="email" th:field="*{email}" required><br/>
        Course: <input type="text" th:field="*{courseName}" required><br/>
        Faculty: <input type="text" th:field="*{facultyName}" required><br/>
        Rating: <input type="number" th:field="*{rating}" min="1" max="5"><br/>
        Comments:<br/>
        <textarea th:field="*{comments}"></textarea><br/>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
